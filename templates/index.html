<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus AI | Matrix Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --green: #00ff41; --pink: #ff007f; --black: #050505; }
        body { background: var(--black); color: var(--green); font-family: 'JetBrains Mono', monospace; margin: 0; display: flex; justify-content: center; }
        .terminal { width: 100%; max-width: 800px; padding: 40px; }
        h1 { font-family: 'Orbitron', sans-serif; text-align: center; color: var(--pink); text-shadow: 0 0 20px var(--pink); letter-spacing: 10px; }
        
        .main-card { 
            background: rgba(0, 255, 65, 0.05); 
            border: 2px solid var(--green); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1); 
        }

        select, textarea { 
            width: 100%; background: #000; border: 1px solid var(--green); 
            color: var(--green); padding: 15px; margin-bottom: 20px; 
            border-radius: 5px; box-sizing: border-box; outline: none; 
        }

        button { 
            width: 100%; padding: 15px; background: var(--pink); 
            border: none; color: white; font-family: 'Orbitron', sans-serif; 
            cursor: pointer; border-radius: 5px; font-weight: bold; 
            letter-spacing: 2px; transition: 0.3s;
        }

        button:hover { box-shadow: 0 0 20px var(--pink); transform: scale(1.02); }

        /* FIX: Output area style */
        .output-box { 
            margin-top: 30px; border-top: 2px solid var(--pink); 
            padding-top: 20px; color: #fff; line-height: 1.6;
        }

        #typed-text { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
<div class="terminal">
    <h1>NEXUS AI</h1>
    <div class="main-card">
        <form method="POST">
            <label>SELECT_LANGUAGE</label>
            <select name="language">
                <option value="Auto Detect">AUTO_DETECT</option>
                <option value="Java">JAVA</option>
                <option value="JavaScript">JAVASCRIPT</option>
                <option value="C++">C++</option>
                <option value="Python">PYTHON</option>
            </select>
            <textarea name="code" placeholder="Paste code sequence..." required></textarea>
            <button type="submit" id="btn" onclick="this.innerText='DECRYPTING...'; this.style.opacity='0.5';">
    START DECRYPTION
</button>
        </form>

        {% if explanation %}
        <div class="output-box">
            <div id="typed-text"></div>
        </div>
        {% endif %}
    </div>
</div>

<script>
    // CRITICAL FIX: The |tojson filter prevents JS syntax errors
    const content = {{ explanation|tojson|safe }};
    let i = 0;

    function typeWriter() {
        const target = document.getElementById("typed-text");
        if (i < content.length) {
            // Check for our custom <br> tags
            if (content.substring(i, i + 4) === "<br>") {
                target.innerHTML += "<br>";
                i += 4;
            } else {
                target.innerHTML += content.charAt(i);
                i++;
            }
            setTimeout(typeWriter, 15);
        }
    }

    window.onload = () => {
        if (content && content.length > 0) {
            typeWriter();
        }
    };
</script>
</body>
</html>
